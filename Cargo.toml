[workspace]
resolver = "2"
members = ["crates/ms43-core", "crates/ms43-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serialport = "4"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
